name: Build

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["*"]

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout sources
              uses: actions/checkout@v4

            - name: Debug paths
              run: |
                  echo "Current directory: $(pwd)"
                  echo "Files in current directory:"
                  ls -la
            # `compile-typst-action` cannot pass `--root`, which the decks
            # need: each course imports `../preamble.typ` and `../libs/`, so
            # the project root has to be the repository, not the deck's folder.
            - name: Install Typst
              uses: typst-community/setup-typst@v4
              with:
                  typst-version: "0.15.1"

            - name: Compile Typst Files
              run: |
                  set -euo pipefail
                  for src in \
                      MAT336/slides-336.typ \
                      MAT246/slides-01.typ \
                      MAT246/slides-02.typ \
                      MAT246/slides-03.typ \
                      MAT246/slides-04.typ \
                      MAT246/slides-07.typ \
                      MAT246/slides-08.typ \
                      MAT246/slides-09.typ \
                      MAT235/slides-12.typ \
                      MAT235/slides-13.typ \
                      MAT235/slides-14.typ \
                      MAT235/slides-15.typ \
                      MAT235/slides-16.typ \
                      MAT235/slides-17.typ \
                      MAT235/slides-18.typ \
                      MAT235/slides-19.typ \
                      MAT235/slides-20.typ
                  ; do
                      echo "==> $src"
                      typst compile --root . --font-path ./fonts "$src" "${src%.typ}.pdf"
                  done

            # upload all the built PDFs as an artifact.
            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifacts
                  include-hidden-files: true
                  # Include something from the root so the file tree matches the full file tree of the repo
                  # (otherwise everything is normalized to the closest common ancestor folder)
                  path: |
                      ./README.md
                      ./**/*.pdf

    build_website:
        name: Build Website
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout sources
              uses: actions/checkout@v4

            - name: Download PDFs
              uses: actions/download-artifact@v4
              with:
                  name: build-artifacts
                  path: ./

            - name: Merge PDFs into website
              run: |
                  mkdir -p website/landing-page/assets/mat235
                  mkdir -p website/landing-page/assets/mat246
                  mkdir -p website/landing-page/assets/mat336
                  cp MAT235/*.pdf website/landing-page/assets/mat235/
                  cp MAT246/*.pdf website/landing-page/assets/mat246/
                  cp MAT336/*.pdf website/landing-page/assets/mat336/

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: website
                  path: website/landing-page

    deploy_to_github_pages:
        runs-on: ubuntu-latest
        if: github.event_name == 'push' &&  (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        needs: build_website

        permissions:
            contents: read
            pages: write
            id-token: write

        concurrency:
            group: "pages"
            cancel-in-progress: false

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Download website artifact
              uses: actions/download-artifact@v4
              with:
                  name: website
                  path: website

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "./website"

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
